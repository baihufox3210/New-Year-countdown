<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新年倒數 | New Year Countdown</title>
    <link data-trunk rel="css" href="style.css">
    <link data-trunk rel="rust" data-wasm-opt="z">
</head>

<body>
    <main class="container">
        <h1 id="title" class="title">新年倒數</h1>

        <section class="card">
            <div class="label">現在時間</div>
            <div id="current-time" class="time-display">--:--:--</div>
            <div id="current-date" class="date-display">&nbsp;</div>

            <div class="countdown-grid">
                <div class="countdown-item">
                    <span id="days" class="number">00</span>
                    <span class="unit">天</span>
                </div>
                <div class="countdown-item">
                    <span id="hours" class="number">00</span>
                    <span class="unit">時</span>
                </div>
                <div class="countdown-item">
                    <span id="minutes" class="number">00</span>
                    <span class="unit">分</span>
                </div>
                <div class="countdown-item">
                    <span id="seconds" class="number">00</span>
                    <span class="unit">秒</span>
                </div>
            </div>
        </section>

        <section class="card progress-section">
            <div class="progress-info">
                <h2 id="progress-title">年度完成度</h2>
                <p id="progress-text">0.000000%</p>
            </div>

            <div class="progress-circle">
                <svg viewBox="0 0 100 100" aria-hidden="true">
                    <circle class="bg" cx="50" cy="50" r="45"></circle>
                    <circle id="progress-bar" class="progress" cx="50" cy="50" r="45"
                        stroke-dasharray="282.7433" stroke-dashoffset="282.7433"></circle>
                </svg>
                <div class="percentage-label"><span id="percent-val">0</span>%</div>
            </div>
        </section>

        <noscript>此頁面需要啟用 JavaScript 以載入 WebAssembly。</noscript>
    </main>
</body>

</html>
