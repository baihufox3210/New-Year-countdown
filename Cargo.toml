[package]
name = "new-year-countdown"
version = "0.1.0"
edition = "2021"
description = "以 Rust + WebAssembly 打造的新年倒數與年度進度網頁"

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
